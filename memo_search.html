<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/memo_search.css">
    <title>メモ検索</title>
</head>
<body>
    <!-- タイトル検索 -->
    <div id="input">
        <p>タイトル検索</p>
        <div class="side-title">
            <input type="text" id="title-search">
            <div class="img-button"><img src="image/search.png" alt="検索ボタン" class="icon"></div>
        </div>
    </div>
    <!-- タグ検索 -->
    <div id="input">
        <p>タグ</p>
        <div id="add-tag-zone">test-tag</div> <!-- タグ追加場所 -->
        <div class="img-button"><a href=""><img src="image/add-tag-button.png" alt="タグ追加" class="icon"></a></div>
    </div>
    <div class="search-results">---検索結果---</div>
    <!-- これで検索結果いっこ -->
    <div id="add-search-zone">
        <div id="add-search-title">test title</div>
        <div id="add-search-tag">test-tag</div>
        <div id="add-search-summary">test summary</div>
    </div>
</body>
</html>
